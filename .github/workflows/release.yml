name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create or release (for example, v1.9.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Create tag if needed
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            files=(de_DE.po de_DE.mo de_DE_x_du.po de_DE_x_du.mo)
            for file in "${files[@]}"; do
              if [[ ! -f "$file" ]]; then
                echo "::error file=$file::Cannot create release tag; required translation file is missing."
                exit 1
              fi
            done

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi
          git checkout --detach "$TAG"

      - name: Verify translation files
        shell: bash
        run: |
          files=(de_DE.po de_DE.mo de_DE_x_du.po de_DE_x_du.mo)
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required translation file is missing."
              exit 1
            fi
          done

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          target="$(git rev-parse "$TAG^{commit}")"
          previous_tag="$(git describe --tags --abbrev=0 "$target^" 2>/dev/null || true)"
          notes_file="$RUNNER_TEMP/release-notes.md"

          if [[ -n "$previous_tag" ]]; then
            printf '## Changes since %s\n\n' "$previous_tag" > "$notes_file"
            range="$previous_tag..$target"
          else
            printf '## Changes\n\n' > "$notes_file"
            range="$target"
          fi

          declare -A changes=()
          while IFS= read -r subject; do
            if [[ "$subject" == *:* ]]; then
              prefix="${subject%%:*}"
              type="${prefix%%(*}"
              type="${type%!}"
              subject="${subject#*:}"
              subject="${subject# }"
            else
              type="other"
            fi

            case "$type" in
              feat) category='Features' ;;
              fix) category='Fixes' ;;
              perf) category='Performance' ;;
              docs) category='Documentation' ;;
              ci|build|chore|refactor|test|style|revert) category='Maintenance' ;;
              *) category='Other changes' ;;
            esac

            changes["$category"]+="- $subject"$'\n'
          done < <(git log --no-merges --format='%s' "$range")

          for category in Features Fixes Performance Documentation Maintenance 'Other changes'; do
            if [[ -n "${changes[$category]:-}" ]]; then
              printf '### %s\n\n%s\n' "$category" "${changes[$category]}" >> "$notes_file"
            fi
          done

          if [[ $(wc -l < "$notes_file") -le 2 ]]; then
            printf '%s\n' '- No commit summaries available.' >> "$notes_file"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create translation ZIP
        id: package
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zip
          package="$RUNNER_TEMP/YOURLS-de_DE-${TAG}.zip"
          zip -j "$package" de_DE.po de_DE.mo de_DE_x_du.po de_DE_x_du.mo
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag='${{ steps.notes.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" "${{ steps.package.outputs.path }}" --clobber